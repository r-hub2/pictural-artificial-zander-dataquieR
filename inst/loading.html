<div id="loading-ani" style="position: fixed;top: 0px;left: 0px;z-index: 999999999;background: grey;opacity: 0.9;width: 100%;text-align: center;height: 100%;vertical-align: middle;">
<p style="top: 50%;position: fixed;text-align: center;width: 100%;" class="fa-3x">
  <i class="fas fa-spinner fa-spin"></i> Loading, please wait...
</p>
</div>

<script type="text/javascript">
window.hideDataquieRLoading = function(immediate) {
  var loading = $('#loading-ani');
  loading.stop(true, true);
  if (immediate) {
    loading.hide();
  } else {
    loading.fadeOut();
  }
};

$(window).on("load pageshow", function() {
  window.hideDataquieRLoading(false);
});

if (document.readyState === "complete") {
  window.hideDataquieRLoading(true);
}
</script>
